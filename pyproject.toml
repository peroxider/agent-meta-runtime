[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "agent-meta-runtime"
# Version is single-sourced from `src/agent_meta_runtime/__init__.py` (`__version__`).
dynamic = ["version"]
description = "Reflective + evolvable agent meta-runtime: white-box self-model, causal history and composition control plane."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["agent", "runtime", "meta-runtime", "agent-meta-runtime"]
dependencies = ["protobuf>=6.31.1,<8", "cryptography>=43"]

[project.optional-dependencies]
ipython = ["ipykernel>=7.4,<8", "jupyter-client>=8.10,<9"]
context-tokenizer = ["tokenizers==0.23.3"]
otel = []
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "cryptography>=43",
  "protobuf>=5",
]

[project.scripts]
agent-meta = "agent_meta_runtime.interfaces.cli:main"
agent-meta-provider-credential = "agent_meta_runtime.interfaces.cli.provider_credentials:main"
agent-meta-restore = "agent_meta_runtime.interfaces.cli.restore:main"

[tool.hatch.version]
path = "src/agent_meta_runtime/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_meta_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
