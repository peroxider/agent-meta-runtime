  RESTART_MODE_NEVER = 1;
  RESTART_MODE_ON_FAILURE = 2;
  RESTART_MODE_ALWAYS = 3;
}

// K2 (planning/v0.2 07 K2.M1): supervision restart strategy (06 K2.V1.1).
// UNSPECIFIED ≡ ONE_FOR_ONE (K1 behavior); K1 deployments are unaffected.
enum RestartStrategy {
  RESTART_STRATEGY_UNSPECIFIED = 0;
  RESTART_STRATEGY_ONE_FOR_ALL = 1;
  RESTART_STRATEGY_REST_FOR_ONE = 2;
}

// §35.13 auxiliary enum.
enum ChannelRole {
  CHANNEL_ROLE_UNSPECIFIED = 0;
