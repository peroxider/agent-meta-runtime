// AgentOS Execution Kernel — shared types (§35.10 enum registry, §35.11/35.12/35.13 aux).
//
// ABI note: §35.10 fixes enum *wire numbers*; because proto3 scopes enum value
// names to the enclosing package (C++ scoping rules), every value carries an
// <ENUM_NAME_> prefix. Numbers — the actual wire contract — are frozen.

syntax = "proto3";

package agentos.kernel.v1;

import "agentos/kernel/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Enum registry (§35.10) — wire numbers frozen, *_UNSPECIFIED=0 per §35.10 rule
// ---------------------------------------------------------------------------

